name: Build Flutter APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11 (old project er jonno)
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create missing key.properties (build fail fix)
        run: |
          mkdir -p android
          cat > android/key.properties << EOF
          storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=upload.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Debug - List all APK files (problem check korar jonno)
        run: find build -name "*.apk" -type f || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioplayer-apk
          path: build/app/outputs/**/app-*.apk   # old + new Flutter duitai catch kore
